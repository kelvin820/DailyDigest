name: Regenerate one story for editorial review
on:
  workflow_dispatch:
    inputs:
      request_json:
        description: 'Paste request_json copied from the DayDay review page'
        type: string
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: dayday-file-publication
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-pdf.txt
      - name: Find browser
        run: |
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser_path" ]; then echo "DD_CHROME=$browser_path" >> "$GITHUB_ENV"; else pnpm exec playwright install chromium; fi
      - name: Resume this run without repeating completed calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=story-regeneration-$GITHUB_RUN_ID&per_page=20" > /tmp/dayday-regeneration-artifacts.json
          previous_run=$(node --input-type=module -e 'import{readFileSync}from"node:fs";const a=JSON.parse(readFileSync("/tmp/dayday-regeneration-artifacts.json")).artifacts.sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at))[0];if(a?.expired)throw Error("RESUME_ARTIFACT_EXPIRED");if(a)process.stdout.write(String(a.workflow_run.id))')
          if [ -n "$previous_run" ]; then gh run download "$previous_run" -n "story-regeneration-$GITHUB_RUN_ID" -D output/previous-regeneration; echo 'REGENERATION_RESUME_DIR=output/previous-regeneration' >> "$GITHUB_ENV"; fi
      - name: Generate and review selected story only
        id: generation
        continue-on-error: true
        run: node --import tsx scripts/regenerate-story.ts
        env:
          REGENERATION_REQUEST: ${{ inputs.request_json }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.NVIDIA_API_KEY }}
      - name: Add result to the public review page, including incomplete results
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"
          node --import tsx scripts/import-benchmark.ts output/story-regeneration
          pnpm typecheck
          git add content/benchmarks/index.json public/benchmarks
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="$GITHUB_ACTOR" -c user.email="$GITHUB_ACTOR@users.noreply.github.com" commit -m 'Add single-story regeneration for editorial review'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Report partial generation
        if: steps.generation.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-regeneration-${{ github.run_id }}
          path: output/story-regeneration/
          retention-days: 14
