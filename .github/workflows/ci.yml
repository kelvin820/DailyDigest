name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          DEMO_MODE: 'true'
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/offline.mjs
      - run: node scripts/qa-offline.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pypdf
      - run: python scripts/verify-pdfs.py
      - uses: actions/upload-artifact@v4
        with:
          name: demo-proof
          path: output/

