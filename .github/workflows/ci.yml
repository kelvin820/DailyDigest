name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: node --import tsx scripts/check-publications.ts
      - run: node --import tsx scripts/check-benchmarks.ts
      - run: pnpm build
        env:
          DEMO_MODE: 'true'
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-pdf.txt
      - run: node scripts/qa-font-unicode.mjs
      - run: node scripts/offline.mjs
      - run: node scripts/qa-offline.cjs
      - run: python scripts/verify-pdfs.py
      - run: node scripts/qa-print-failures.mjs
      - run: node scripts/qa-app.mjs
      - run: pnpm test:preview
      - run: pnpm test:publications
      - run: pnpm test:web
      - run: node scripts/test-db.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: demo-proof
          path: output/

