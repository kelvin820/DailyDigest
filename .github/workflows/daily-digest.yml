name: Daily Digest
on:
  schedule:
    - cron: '17 22 * * *'
    - cron: '17 23 * * *'
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'YYYY-MM-DD Taipei; empty means today'
        type: string
      resume:
        type: boolean
        default: true
      draft_only:
        type: boolean
        default: true
      force_new_revision:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: dayday-production
  cancel-in-progress: false
jobs:
  digest:
    if: vars.DD_PIPELINE_ACCEPTED == 'true' && github.ref_name == github.event.repository.default_branch
    environment: production
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DD_PIPELINE_ACCEPTED: ${{ vars.DD_PIPELINE_ACCEPTED }}
      DEMO_MODE: 'false'
      LIVE_GENERATION_ENABLED: 'true'
      LLM_PROVIDER: nvidia
      LLM_BASE_URL: https://integrate.api.nvidia.com/v1
      WRITER_MODEL: ${{ vars.WRITER_MODEL || 'nvidia/nemotron-3-nano-30b-a3b' }}
      REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL || 'nvidia/nemotron-3-nano-30b-a3b' }}
      DAILY_BUDGET_USD: ${{ vars.DAILY_BUDGET_USD || '2' }}
      MAX_MODEL_CALLS: ${{ vars.MAX_MODEL_CALLS || '100' }}
      MAX_MODEL_TOKENS: ${{ vars.MAX_MODEL_TOKENS || '200000' }}
      LLM_INPUT_USD_PER_MILLION: ${{ vars.LLM_INPUT_USD_PER_MILLION }}
      LLM_OUTPUT_USD_PER_MILLION: ${{ vars.LLM_OUTPUT_USD_PER_MILLION }}
      PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'review' }}
      ISSUE_DATE: ${{ inputs.issue_date }}
      RESUME: ${{ github.event_name != 'workflow_dispatch' || inputs.resume }}
      DRAFT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_only }}
      FORCE_NEW_REVISION: ${{ inputs.force_new_revision || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-pdf.txt
      - run: pnpm exec playwright install --with-deps chromium
      - name: Preflight
        run: node scripts/preflight.mjs
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Resume durable issue worker
        run: pnpm pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
